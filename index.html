<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d6f63">
<title>CFA Level I Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
/* Layout: left rail of sections on desktop, bottom tab bar on phones; one working column of panels. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ed; --line:#d3dce2;
  --ink:#13202a; --muted:#5a6b78; --accent:#0d6f63; --accent-ink:#ffffff; --accent-soft:#d9eeea;
  --good:#1f7a3f; --good-soft:#dcf0e2; --warn:#a56410; --warn-soft:#f7ead4; --bad:#b3362c; --bad-soft:#f8e1de;
  --display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#16212a; --sunk:#1d2a34; --line:#2a3945;
  --ink:#e3eaef; --muted:#93a4b1; --accent:#43bfa9; --accent-ink:#06201c; --accent-soft:#16352f;
  --good:#5bc483; --good-soft:#173322; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7b70; --bad-soft:#3d1e1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#16212a; --sunk:#1d2a34; --line:#2a3945;
  --ink:#e3eaef; --muted:#93a4b1; --accent:#43bfa9; --accent-ink:#06201c; --accent-soft:#16352f;
  --good:#5bc483; --good-soft:#173322; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7b70; --bad-soft:#3d1e1b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100%}
nav.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;padding:0 10px 14px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--sunk);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
nav svg{width:18px;height:18px;flex:none}
main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover{background:var(--sunk)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.06);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.small{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px;font-family:var(--body);line-height:1.5}
textarea.mono{font-family:var(--mono);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px}
.row>.fit{flex:0 0 auto}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .meta{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.now td{background:var(--accent-soft)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.warn i{background:var(--warn)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);display:flex;flex-direction:column;gap:12px}
.next .eyebrow{color:inherit;opacity:.8}
.next h2{font-size:22px}
.next p{margin:0;opacity:.92}
.next button{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);align-self:flex-start}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tpl button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px 14px;font-weight:500}
.tpl button b{font-weight:700}
.tpl button span{font-size:12.5px;color:var(--muted)}
.tpl button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* session runner */
.runner{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted);background:transparent;border:0;text-align:left;width:100%;font-weight:500}
.step .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
.step.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.step.on .dot{border-color:var(--accent);color:var(--accent)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .m{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.clock{font-family:var(--mono);font-size:56px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.clock.over{color:var(--warn)}
.why{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.guide{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.card-face{min-height:150px;display:grid;place-items:center;text-align:center;font-size:18px;padding:24px;background:var(--bg);border-radius:var(--r);border:1px solid var(--line);white-space:pre-wrap}
.card-face.back{font-size:16px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{justify-content:center;flex-direction:column;gap:0}
.rate small{font-weight:400;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50}
.sync{font-size:12px;color:var(--muted);padding:0 10px;margin-top:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.chk input{width:auto}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
.rate-chips{display:inline-flex;gap:3px;flex:none}
.rc{width:28px;height:28px;padding:0;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);border-radius:6px}
.rc.on{border-color:transparent}
.rc.on.bad,.rate-big button.on.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.rc.on.warn,.rate-big button.on.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.rc.on.acc,.rate-big button.on.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rc.on.good,.rate-big button.on.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.rate-big{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate-big button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;font-weight:500;padding:10px 12px}
.rate-big button span{font-size:12px;color:var(--muted);font-weight:400}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13.5px}
@media (max-width:860px){.rate-big{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .brand,.sync{display:none}
  nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;justify-content:center}
  nav a .ct{position:absolute;margin:0 0 0 22px;font-size:9px;padding:0 5px}
  nav a{position:relative}
  main{padding-bottom:110px}
  .hero,.grid2,.grid3,.runner{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .steps{flex-direction:row;overflow-x:auto}
  .step{flex:none;width:auto}
  .step .m{display:none}
  .clock{font-size:44px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.auth{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.auth .err{color:var(--bad);font-size:13.5px;min-height:1em;margin:0}
.signout{margin-top:6px;font-size:13px;padding:6px 10px;justify-content:flex-start;border-color:transparent;background:transparent;color:var(--muted)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="auth" id="auth" hidden>
  <form class="panel" id="loginForm" autocomplete="on">
    <div><div class="eyebrow">CFA Level I · May 2027</div><h1 style="font-size:24px;margin-top:4px">Study Hub</h1></div>
    <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" id="lTrust"> Keep me signed in on this device</label>
    <p class="sub" style="font-size:12.5px;margin:-6px 0 0">Leave this unticked on public computers. You’ll be signed out when the browser closes or after an hour without activity.</p>
    <p class="err" id="lErr"></p>
    <button class="primary" type="submit" id="lBtn" style="justify-content:center">Sign in</button>
  </form>
</div>
<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Sections">
    <div class="brand">CFA L1 Hub<small>MAY 11–17, 2027</small></div>
    <a href="#today" data-nav="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</a>
    <a href="#progress" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16"/><rect x="5" y="11" width="3" height="6"/><rect x="10.5" y="7" width="3" height="10"/><rect x="16" y="4" width="3" height="13"/></svg>Progress</a>
    <a href="#session" data-nav="session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 5l12 7-12 7z"/></svg>Session</a>
    <a href="#plan" data-nav="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</a>
    <a href="#cards" data-nav="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 7V5h14v12h-4"/></svg>Anki<span class="ct" id="dueCt" hidden></span></a>
    <a href="#mistakes" data-nav="mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Mistakes</a>
    <a href="#scores" data-nav="scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Scores</a>
    <a href="#notes" data-nav="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Notes</a>
    <div class="sync"><span id="sync">Connecting…</span><button class="signout" data-act="signout">Sign out</button></div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- reference data ---------- */
const EXAM = '2027-05-11';
const TOPICS = {
  ethics:{name:'Ethical and Professional Standards',short:'Ethics',w:'15–20%',fam:'low'},
  quant:{name:'Quantitative Methods',short:'Quant',w:'6–9%',fam:'med'},
  econ:{name:'Economics',short:'Economics',w:'6–9%',fam:'med'},
  fsa:{name:'Financial Statement Analysis',short:'FSA',w:'11–14%',fam:'low'},
  corp:{name:'Corporate Finance',short:'Corporate',w:'6–9%',fam:'med'},
  equity:{name:'Equities',short:'Equities',w:'11–14%',fam:'high'},
  fi:{name:'Fixed Income',short:'Fixed Income',w:'11–14%',fam:'med'},
  deriv:{name:'Derivatives',short:'Derivatives',w:'5–8%',fam:'low'},
  alts:{name:'Alternative Investments',short:'Alternatives',w:'7–10%',fam:'med'},
  pm:{name:'Portfolio Construction',short:'Portfolio',w:'8–12%',fam:'high'}
};
const START='2026-11-02', REVIEW_END='2027-04-11', MOCK_END='2027-05-09';
const DEFAULT_PLAN={order:['ethics','quant','econ','fsa','corp','equity','fi','deriv','alts','pm'],weeks:{ethics:1,quant:2,econ:2,fsa:5,corp:1,equity:2,fi:3,deriv:2,alts:1,pm:1}};
const SCHWESER_PLAN={order:['quant','econ','corp','fsa','equity','fi','deriv','alts','pm','ethics'],weeks:{quant:1,econ:2,corp:1,fsa:5,equity:2,fi:3,deriv:2,alts:1,pm:1,ethics:2}};
let BLOCKS=[];
function planCfg(){const p=S.settings?.plan;return p&&Array.isArray(p.order)&&p.order.length===10&&p.weeks?p:DEFAULT_PLAN}
function computeBlocks(){
  const p=planCfg(),out=[];let d=START;
  p.order.forEach((k,i)=>{const w=Math.max(1,p.weeks[k]||1),e=addDays(d,w*7-1);
    out.push({k,s:d,e,label:k==='ethics'&&i===0?'Ethics first pass':null,note:(d<='2026-12-27'&&e>='2026-12-21')?'Christmas week kept light':''});d=addDays(e,1)});
  const rEnd=addDays(d,6)>REVIEW_END?addDays(d,6):REVIEW_END;
  out.push({k:'review',s:d,e:rEnd,label:p.order[0]==='ethics'?'Review + Ethics deep pass':'Review'});
  const mS=addDays(rEnd,1);
  out.push({k:'mocks',s:mS,e:mS>MOCK_END?mS:MOCK_END,label:'Mocks (Apr 17, Apr 24, May 1)'});
  out.push({k:'exam',s:'2027-05-11',e:'2027-05-17',label:'Exam window'});
  return out;
}
function learnEnd(){return BLOCKS.find(b=>b.k==='review')?.s?addDays(BLOCKS.find(b=>b.k==='review').s,-1):'2027-03-21'}
function checkpoints(){return [
  {d:learnEnd(),t:'Every topic done once, 65%+ on mixed sets'},
  {d:'2027-04-17',t:'Mock 1 — 60% floor'},
  {d:'2027-04-24',t:'Mock 2 — aim for 65%+'},
  {d:'2027-05-01',t:'Mock 3 (CFA Institute) — aim for 70%+'}]}
const FAM = {low:'New to you',med:'Some background',high:'You use it at work'};
const TAGS = {concept:'Concept',formula:'Formula',misread:'Misread',calc:'Calculator'};
const TAG_FIX = {concept:'Re-study the module',formula:'Make a flashcard',misread:'Slow down on the question stem',calc:'Practise the keystrokes'};

/* ---------- session templates ---------- */
const WHY = {
  preview:'Pretesting and advance organisers: knowing the goal first gives new material something to attach to.',
  learn:'Generation effect: solving examples yourself before reading the solution beats reading along.',
  blurt:'Retrieval practice: pulling information out of memory strengthens it far more than rereading.',
  quiz:'The testing effect: questions build memory, and the explanations correct errors while they are fresh.',
  capture:'Spaced repetition only works on what you capture. Log misses now, while you know why.',
  cards:'Spacing: reviewing just before you forget is the cheapest way to keep old topics alive.',
  mixed:'Interleaving: mixed sets train you to recognise which concept a question is testing.',
  redo:'Error correction: redoing a missed question days later turns a weak spot into a known one.',
  formula:'Free recall of a whole sheet shows exactly what you have forgotten.',
  ethics:'Little and often: Ethics wording sticks through steady exposure, not cramming.',
  break:'Short breaks between blocks restore attention without breaking your rhythm.',
  timed:'Practising at exam pace (about 90 seconds a question) builds the timing you need in May.'
};
function moduleSteps(fam){
  const learnGuide = {
    low:['Watch the Masterclass segment at 1.25–1.5x for the intuition.','Then read the SchweserNotes module.','Solve every worked example on your calculator before reading the solution.'],
    med:['Read the SchweserNotes module.','Solve every worked example on your calculator before reading the solution.','Save the video for anything the quiz shows you missed.'],
    high:['You already took the quiz cold. Skim the notes only for what you missed.','Skip the video unless a miss still makes no sense.']
  }[fam];
  const preview = {id:'preview',type:'text',t:'Preview the LOS',m:2,why:WHY.preview,guide:['Read the module’s Learning Outcome Statements.','“Calculate” means you need the formula and calculator steps.','“Describe” or “compare” means concepts and distinctions.']};
  const learn = {id:'learn',type:'text',t:fam==='high'?'Fill the gaps':'Learn',m:fam==='high'?20:30,why:WHY.learn,guide:learnGuide};
  const blurt = {id:'blurt',type:'blurt',t:'Blurt from memory',m:5,why:WHY.blurt,guide:['Close the notes. Write the key ideas, formulas and distinctions you remember.','Check against the notes. When you finish a reading, check against its Key Concepts page.','List what you missed. Those gaps become Anki cards.']};

  const key=m=>[overconfident(k,m)?0:1,m.rating??2.5,moduleScore(m.id)??100];
  const sorted=doneMods(k).slice().sort((a,b)=>{const x=key(a),y=key(b);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return 0});
  const flagged=sorted.filter(m=>overconfident(k,m)||(m.rating&&m.rating<=2));
  return (flagged.length?flagged:sorted.slice(0,2)).slice(0,n);

/* ---------- adaptive topic revisits ---------- */
const scoreLevel = p=>p<55?1:p<65?2:p<75?3:4;
const INIT_GAP = {1:4,2:7,3:10,4:14};
function reviewStart(){return BLOCKS.find(b=>b.k==='review')?.s||'2027-03-22'}
function revisitBaseDate(k){
  const it=mods(k), dn=it.filter(m=>m.done), b=BLOCKS.find(x=>x.k===k), t=todayISO();
  if(!dn.length)return null;
  if(dn.length===it.length)return dn.map(m=>m.doneOn||b?.e||t).sort().at(-1);
  return b&&t>b.e?b.e:null;
}
function topicSchedule(k){
  const base=revisitBaseDate(k); if(!base)return null;
  const logs=revLogs(k), wk=weakest(k), t=todayISO();
  let gap=INIT_GAP[wk]||7, next=addDays(base,gap), skip=false, lastL=null;
  logs.forEach((g,i)=>{
    const L=scoreLevel(g.pct);
    gap=L===1?4:L===2?Math.max(7,gap):L===3?Math.round(gap*2.5):Math.round(gap*3.5);
    next=addDays(g.date,gap);
    skip=L===4&&lastL===4&&wk===4; lastL=L;
  });
  const since=logs.at(-1)?.date||base;
  doneMods(k).forEach(m=>{if(m.ratedOn&&m.ratedOn>since){if(m.rating===1)next=next<addDays(m.ratedOn,4)?next:addDays(m.ratedOn,4);else if(m.rating===2)next=next<addDays(m.ratedOn,7)?next:addDays(m.ratedOn,7)}});
  const oc=topicOverconfident(k);
  const lvl=logs.length?Math.min(scoreLevel(logs.at(-1).pct),wk||4):wk;
  const size=oc||(lvl&&lvl<=2)?'25–30':lvl===4?'15':'20';
  const toReview=skip||next>=reviewStart();
  return {k,base,next:toReview?null:next,toReview,gap,n:logs.length+1,wk,oc,last:logs.at(-1),size,
    overdue:next&&!toReview?Math.max(0,diffDays(next,t)):0,focus:focusModules(k)};
}

/* ---------- pace tracking ---------- */
const NEW_TPLS = new Set(['module','deep']);
const ASSUMED_PACE = 0.7;
function paceStats(){
  const act={};
  arr('sessions').forEach(s=>{if(s.moduleId&&NEW_TPLS.has(s.tpl))act[s.moduleId]=(act[s.moduleId]||0)+(s.minutes||0)});
  let a=0,e=0,n=0;
  Object.keys(TOPICS).forEach(k=>mods(k).forEach(m=>{if(m.done&&act[m.id]){a+=act[m.id];e+=modEst(k,m);n++}}));
  const pace=n>=3&&e?a/e:null, used=pace??ASSUMED_PACE;
  const remEst=Object.keys(TOPICS).reduce((x,k)=>x+mods(k).filter(m=>!m.done).reduce((y,m)=>y+modEst(k,m),0),0);
  const remH=remEst*used/60;
  // new-material hours per week: average of the last 3 finished weeks that had any, else plan (10.5 h minus 2 h review)
  const t=todayISO(), ws=weekStart(t), byW={};
  arr('sessions').forEach(s=>{if(NEW_TPLS.has(s.tpl)){const w=weekStart(s.date);byW[w]=(byW[w]||0)+(s.minutes||0)}});
  const recent=[1,2,3].map(i=>byW[addDays(ws,-7*i)]).filter(v=>v>0);
  const perWeek=recent.length>=2?recent.reduce((x,y)=>x+y,0)/recent.length/60:8.5;
  let weeks=perWeek?remH/perWeek:99;
  if(t<='2026-12-27'&&addDays(t,Math.ceil(weeks*7))>='2026-12-21')weeks+=0.5;
  const finish=addDays(t,Math.ceil(weeks*7));
  return {pace,used,n,remH,perWeek,measuredWeeks:recent.length,finish,end:learnEnd(),slack:diffDays(finish,learnEnd())};
}
function splitHours(fromDate){
  let nw=0,rv=0;arr('sessions').forEach(s=>{if(fromDate&&s.date<fromDate)return;if(NEW_TPLS.has(s.tpl))nw+=s.minutes||0;else rv+=s.minutes||0});
  return {nw:nw/60,rv:rv/60,share:nw+rv?rv/(nw+rv):null};
}
function paceLine(p){
  if(p.slack>=0)return `<span class="pill good">On track</span> First pass projected to finish <b>${fmt(p.finish)}</b>, ${p.slack} day${p.slack===1?'':'s'} before ${fmt(p.end)}.`;
  const wl=Math.max(1,diffDays(todayISO(),p.end)/7), extra=Math.max(0.5,Math.ceil((p.remH/wl-p.perWeek)*2)/2);
  return `<span class="pill bad">Behind</span> First pass projected to finish <b>${fmt(p.finish)}</b>, ${-p.slack} days after ${fmt(p.end)}. About ${extra} more hour${extra===1?'':'s'} a week of new material closes the gap.`;
}
function pacePanel(){
  const p=paceStats(), wk=splitHours(weekStart(todayISO())), all=splitHours(null);
  return `<section class="panel"><div class="panel-h"><h2>Pace</h2><span class="sub" style="font-size:12.5px">Based on CFA Institute’s time estimate for each module</span></div>
  <p style="margin:0 0 12px">${paceLine(p)}</p>
  <div class="stats">
    <div class="stat"><b class="num">${Math.round(p.used*100)}%</b><span>${p.pace!=null?`of CFA’s time (${p.n} modules timed)`:'assumed until 3 modules are timed'}</span></div>
    <div class="stat"><b class="num">${p.remH.toFixed(0)} h</b><span>first pass left at this pace</span></div>

    <div class="stat"><b class="num">${all.share==null?'—':Math.round(all.share*100)+'%'}</b><span>review share overall · target ~20%</span></div></div>

/* ---------- suggested topic weeks ---------- */
function suggestWeeks(){
  const p=planCfg(), t=todayISO(), used=paceStats().used, LEARN_END='2027-03-21';
  const ci=Math.max(0,p.order.findIndex(k=>{const b=BLOCKS.find(x=>x.k===k);return b&&t>=b.s&&t<=b.e}));
  const curB=BLOCKS.find(x=>x.k===p.order[ci]);
  const from=t<START?START:weekStart(t);
  const elapsed=curB&&from>curB.s?Math.round(diffDays(curB.s,from)/7):0;
  const W=[];for(let w=from;w<=LEARN_END;w=addDays(w,7))W.push(w==='2026-12-21'?0.5:1);
  const ks=p.order.slice(ci), h=ks.map(k=>Math.max(0.1,mods(k).filter(m=>!m.done).reduce((a,m)=>a+modEst(k,m),0)*used/60));
  const H=h.reduce((a,b)=>a+b,0), C=W.reduce((a,b)=>a+b,0);
  if(W.length<ks.length)return null;
  const cum=[];W.reduce((a,c,i)=>(cum[i]=a+c),0);
  const weeks={...p.weeks}; let prev=-1, acc=0;
  ks.forEach((k,i)=>{
    acc+=h[i]; const T=C*acc/H, left=ks.length-1-i;
    let best=prev+1;
    for(let j=prev+1;j<=W.length-1-left;j++){if(Math.abs(cum[j]-T)<Math.abs(cum[best]-T))best=j}
    if(i===ks.length-1)best=W.length-1;
    weeks[k]=(i===0?elapsed:0)+(best-prev); prev=best;
  });
  return {weeks,hours:Object.fromEntries(ks.map((k,i)=>[k,h[i]])),used};
}

  if(t<b.s)return 0; if(t>b.e)return 1;
  return (diffDays(b.s,t)+1)/(diffDays(b.s,b.e)+1);
}

  <section class="panel"><div class="panel-h"><h2>Modules</h2><span class="sub" style="font-size:12.5px">Tick, rate, reorder or add modules</span></div>

function stepBody(st){

    <label>From memory, notes closed<textarea id="fBlurt" data-bind="blurt" placeholder="Key ideas, formulas, distinctions…">${esc(d.blurt||'')}</textarea></label>

        return w.length?`<section class="panel"><h2 style="margin-bottom:8px">Build this set from your weakest modules</h2><div class="list">${w.map(({k,m})=>`<div class="li"><span class="pill">${esc(TOPICS[k].short)}</span><span class="grow">${esc(m.name)}</span>${m.rating?`<span class="pill ${RATING[m.rating].c}">${m.rating}</span>`:'<span class="meta">unrated</span>'}${overconfident(k,m)?'<span class="pill bad">⚑</span>':''}</div>`).join('')}</div></section>`:''})():''}

    </section>

  }

    return `<section class="panel"><div class="row"><label>Topic<select id="fsTopic">${Object.entries(TOPICS).map(([k,t])=>`<option value="${k}" ${k===(run.data.fsTopic||run.topic)?'selected':''}>${esc(t.short)}</option>`).join('')}</select></label></div>

  return `<section class="panel"><details ${planOpen?'open':''} id="planEd"><summary style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2 style="color:var(--ink)">Topic order and weeks</h2>${warn}</summary>

function rateCard(c,r){
  let iv=c.interval||0, e=c.ease||2.5, t=todayISO();
  if(r==='again'){iv=0;e=Math.max(1.3,e-.2)}
  else if(r==='hard'){iv=Math.max(1,Math.round(iv*1.2));e=Math.max(1.3,e-.15)}
  else if(r==='good'){iv=iv<1?1:iv<3?3:Math.round(iv*e)}
  else {iv=Math.round((iv<1?1:iv<3?3:iv*e)*1.3);e+=.15}
  const {id,...rest}=c;
  return {id,data:{...rest,interval:iv,ease:+e.toFixed(2),due:addDays(t,iv),reps:(c.reps||0)+1,last:t}};
}
function newCard(front,back,topic){return {front,back,topic,interval:0,ease:2.5,due:todayISO(),reps:0,created:todayISO()}}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='quickstart'){ if(!run){setup.tpl=b.dataset.tpl;setup.topic=b.dataset.topic;setup.moduleId='';setup.touched=true} location.hash='session'; }
  else if(a==='tpl'){setup.tpl=b.dataset.k;forceRender()}
  else if(a==='begin'){
    setup.module=$('#sModule').value.trim();
    const mid=$('#sModSel')?.value||'', mobj=mods(setup.topic).find(m=>m.id===mid);
    run={tpl:setup.tpl,topic:setup.topic,moduleId:mid,module:[mobj?.name,setup.module].filter(Boolean).join(' · '),steps:TEMPLATES[setup.tpl].build(setup.topic),i:0,started:Date.now(),stepStart:Date.now(),elapsed:[],data:{blurt:'',gaps:'',quizzes:[],mistakes:[],cards:[],formulas:''}};
    saveRun();keepAwake();startTick();forceRender();
  }
  else if(a==='pause'){if(run.paused){run.paused=false;run.stepStart=Date.now()}else{bank();run.paused=true}saveRun();forceRender()}
  else if(a==='nextstep'||a==='goto'){
    syncBinds();bank();
    if(a==='goto')run.i=+b.dataset.i; else if(run.i<run.steps.length-1)run.i++; else {run.finished=true;run.paused=true}
    run.stepStart=Date.now(); if(!run.finished)run.paused=false; saveRun();forceRender();window.scrollTo(0,0)
  }
  else if(a==='backto'){run.finished=false;run.paused=false;run.stepStart=Date.now();saveRun();forceRender()}
  else if(a==='abandon'){
    if(b.dataset.sure){run=null;saveRun();forceRender();toast('Session discarded')}
    else{b.dataset.sure=1;b.textContent='Tap again to discard';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Discard this session'}},3000)}
  }
  else if(a==='savesession'){
    const mins=Math.max(1,Math.round(run.steps.reduce((x,_,i)=>x+stepElapsed(i),0)/60));
    const d=run.data, id=uid(), t=todayISO();
    const doc={date:t,ts:Date.now(),tpl:run.tpl,topic:run.topic,module:run.module,moduleId:run.moduleId||null,minutes:mins,planned:run.steps.reduce((x,s)=>x+s.m,0),
      quizzes:d.quizzes.filter(q=>q.n).map(q=>({topic:q.topic,n:+q.n,c:+q.c})),blurt:d.blurt,gaps:d.gaps,focus:+$('#fFocus').value||null,note:$('#fNote').value.trim()};
    const formulas=(d.formulas||'').trim();
    const markDone=$('#fModDone')?.checked, modId=run.moduleId;
    const cards=d.cards.slice(), ms=d.mistakes.slice();
    run=null;saveRun();clearInterval(tick);try{wake?.release()}catch(_){}
    location.hash='today';
    await put('sessions',id,doc);
    for(const c of cards) await put('cards',uid(),newCard(c.front,c.back,c.topic));
    for(const {saved,...m} of ms) if(!saved) await put('mistakes',uid(),m); // older drafts held mistakes until the session was saved
    if(markDone&&modId)await saveMods(doc.topic,mods(doc.topic).map(m=>m.id===modId?{...m,done:true,doneOn:t}:m));
    if(formulas){const n=S.notes[doc.topic]||{};await put('notes',doc.topic,{...n,formulas:((n.formulas||'').trim()+'\n'+formulas).trim()})}
    toast('Session saved');
  }
  else if(a==='addmistake'){
    const why=$('#mWhy').value.trim(); if(!why){$('#mWhy').focus();toast('Add why you got it wrong');return}
    const m={date:todayISO(),topic:b.dataset.topic,qid:$('#mQid').value.trim(),tag:$('#mTag').value,why,rule:$('#mRule').value.trim(),redone:false};
    // Save straight to the mistake log, also during a session, so a miss is never lost if the session is discarded or the tab closes.
    const id=uid(), inSession=run&&view==='session';
    if(inSession)syncBinds();
    const ok=await put('mistakes',id,m);
    if(!ok){delete S.mistakes[id];mDraft=m;forceRender();return}
    mDraft=null;
    if(inSession&&run){run.data.mistakes.push({...m,id,saved:true});saveRun()}
    forceRender();toast('Mistake logged')
  }
  else if(a==='gapfront'){const g=captureLines()[+b.dataset.i];const f=$('#cFront_run');f.value=g;$('#cBack_run').focus()}
  else if(a==='addcard'){
    const ctx=b.dataset.ctx,f=$('#cFront_'+ctx).value.trim(),bk=$('#cBack_'+ctx).value.trim();
    if(!f){$('#cFront_'+ctx).focus();return}
    if(ctx==='run'){syncBinds();run.data.cards.push({front:f,back:bk,topic:run.topic});saveRun();forceRender()}
    else{await put('cards',uid(),newCard(f,bk,$('#cTopic').value));forceRender();toast('Card added')}
  }
  else if(a==='planpreset'){const src=b.dataset.p==='schweser'?SCHWESER_PLAN:DEFAULT_PLAN;await savePlan({order:[...src.order],weeks:{...src.weeks}});toast('Plan reordered')}
  else if(a==='planmove'){const p=planCfg(),o=[...p.order],i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>9)return;[o[i],o[j]]=[o[j],o[i]];await savePlan({order:o,weeks:{...p.weeks}})}
  else if(a==='planweeks'){const p=planCfg(),w={...p.weeks},k=b.dataset.k;w[k]=Math.max(1,(w[k]||1)+ +b.dataset.d);await savePlan({order:[...p.order],weeks:w})}
  else if(a==='modmove'){const k=b.dataset.topic,it=[...mods(k)],i=it.findIndex(m=>m.id===b.dataset.id),j=i+ +b.dataset.dir;if(i<0||j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];openTopics.add(k);await saveMods(k,it);forceRender()}
  else if(a==='anki'){await toggleAnki()}
  else if(a==='ankicopy'){const txt=ankiText(pendingCards());try{await navigator.clipboard.writeText(txt);toast('Copied '+pendingCards().length+' cards')}catch(_){toast('Copy was blocked. Use Download .txt instead.')}}
  else if(a==='ankidl'){const txt='#separator:tab\n#html:false\n#columns:Front\tBack\tTags\n'+ankiText(pendingCards())+'\n';
    const url=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));const el=document.createElement('a');el.href=url;el.download='cfa-anki-'+todayISO()+'.txt';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  else if(a==='signout'){await signOut()}
  else if(a==='ankiadded'){const p=pendingCards();for(const c of p){const {id,...rest}=c;await put('cards',id,{...rest,added:true,addedOn:todayISO()})}forceRender();toast(p.length+' cards marked as in Anki')}
  else if(a==='logrev'){const k=b.dataset.k,c=+$('#rvC_'+k).value,o=+$('#rvN_'+k).value;
    if(!o||c>o||c<0){toast('Enter correct and out of, e.g. 21 of 30');return}
    await put('scores',uid(),{type:'revisit',rev:revLogs(k).length+1,topic:k,date:todayISO(),ts:Date.now(),c,n:o,pct:pct(c,o)});rateAfter=k;forceRender();window.scrollTo(0,0);toast('Revisit logged. Now rate the modules')}
  else if(a==='modrate'){const k=b.dataset.topic,id=b.dataset.id,r=+b.dataset.r;openTopics.add(k);await setRating(k,id,r,b.dataset.src||'progress');forceRender()}
  else if(a==='rateafterdone'){rateAfter=null;forceRender()}
  else if(a==='applyweeks'){const sg=suggestWeeks();if(sg){const p=planCfg();await savePlan({order:[...p.order],weeks:sg.weeks});toast('Plan weeks updated')}}
  else if(a==='delcard'){await del('cards',b.dataset.id);forceRender()}
  else if(a==='startreview'){review={cards:dueCards().sort(()=>Math.random()-.5),i:0,flip:false};forceRender()}
  else if(a==='flip'){review.flip=true;forceRender()}
  else if(a==='rate'){const c=review.cards[review.i];const {id,data}=rateCard(c,b.dataset.r);
    if(b.dataset.r==='again')review.cards.push({...c,...data,id});
    review.i++;review.flip=false;await put('cards',id,data);
    if(review.i>=review.cards.length){review.cards=null;toast('Review done')}
    forceRender()}
  else if(a==='endreview'){review.cards=null;forceRender()}
  else if(a==='mtag'){mFilter.tag=b.dataset.k;forceRender()}
  else if(a==='delmistake'){await del('mistakes',b.dataset.id);forceRender()}
  else if(a==='addscore'){
    const c=+$('#scC').value,n=+$('#scN').value; if(!n||c>n||c<0){toast('Enter correct and out-of, e.g. 41 of 60');return}
    await put('scores',uid(),{type:$('#scType').value,topic:$('#scTopic').value,date:$('#scDate').value||todayISO(),c,n,pct:pct(c,n)});forceRender();toast('Score added')
  }
  else if(a==='delscore'){await del('scores',b.dataset.id);forceRender()}
  else if(a==='modadd'){const k=b.dataset.topic,inp=$('#modAdd_'+k),name=inp.value.trim();if(!name){inp.focus();return}
    openTopics.add(k);await saveMods(k,[...mods(k),{id:uid(),name,done:false}]);forceRender();toast('Module added')}
  else if(a==='moddel'){const k=b.dataset.topic;
    if(b.dataset.sure){openTopics.add(k);await saveMods(k,mods(k).filter(m=>m.id!==b.dataset.id));forceRender()}
    else{b.dataset.sure=1;b.textContent='Remove?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕'}},3000)}}
  else if(a==='ntopic'){noteTopic=b.dataset.k;testMode=false;forceRender()}
  else if(a==='testmode'){testMode=!testMode;forceRender()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.act==='redone'){const m=S.mistakes[t.dataset.id];if(m){await put('mistakes',t.dataset.id,{...m,redone:t.checked,redoneOn:t.checked?todayISO():null});if(view==='mistakes'||view==='session')forceRender()}}
  else if(t.id==='sTopic'){setup.topic=t.value;setup.touched=true;setup.moduleId='';setup.module=$('#sModule').value;forceRender()}
  else if(t.id==='sModSel'){setup.moduleId=t.value||'__other'}
  else if(t.dataset.act==='moddone'){const k=t.dataset.topic;await saveMods(k,mods(k).map(m=>m.id===t.dataset.id?{...m,done:t.checked,doneOn:t.checked?todayISO():null}:m));forceRender()}
  else if(t.id==='cFilter'){cardFilter=t.value;forceRender()}
  else if(t.id==='cShowAdded'){showAdded=t.checked;forceRender()}
  else if(t.id==='mOpen'){mFilter.open=t.checked;forceRender()}
  else if(t.id==='fsTopic'){syncBinds();run.data.fsTopic=t.value;saveRun();forceRender()}
  else if(t.dataset.quiz){syncBinds();forceRender()}
});
function syncBinds(){
  if(!run)return;
  document.querySelectorAll('[data-bind]').forEach(el=>run.data[el.dataset.bind]=el.value);
  document.querySelectorAll('[data-quiz]').forEach(el=>{
    let q=run.data.quizzes.find(x=>x.step===el.dataset.quiz);
    if(!q){q={step:el.dataset.quiz,topic:el.dataset.qtopic,n:'',c:''};run.data.quizzes.push(q)}
    q[el.dataset.f]=el.value===''?'':+el.value;
  });
  saveRun();
}
let noteTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind||t.dataset.quiz){syncBinds()}
  if(t.dataset.note){
    const s=$('#nSaved'); if(s)s.textContent='Saving…';
    clearTimeout(noteTimer); const k=noteTopic;
    S.notes[k]={...(S.notes[k]||{}),[t.dataset.note]:t.value};
    noteTimer=setTimeout(async()=>{await put('notes',k,{...S.notes[k]});const s2=$('#nSaved');if(s2)s2.textContent='Saved'},1200);
  }
});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')))render()},0)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.id==='planEd')planOpen=d.open;if(d.tagName==='DETAILS'&&d.dataset.topic){d.open?openTopics.add(d.dataset.topic):openTopics.delete(d.dataset.topic)}},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run&&!run.paused)keepAwake()});

/* ---------- boot ---------- */
if(run&&!run.paused)startTick();
initStore();
</script>
</body>
</html>
